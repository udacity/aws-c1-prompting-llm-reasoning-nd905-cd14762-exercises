AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda functions for the restaurant recommendation agent exercise

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: restaurant-agent-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GetCuisinesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-cuisines
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
${get_cuisines}

  GetCuisinesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetCuisinesFunction.Arn
      Action: lambda:InvokeFunction
      git 

  SearchRestaurantsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: search-restaurants
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
${search_restaurants}

  SearchRestaurantsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SearchRestaurantsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com

  GetAvailabilityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-availability
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
${get_availability}

  GetAvailabilityPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetAvailabilityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com

Outputs:
  GetCuisinesFunctionArn:
    Description: ARN of the get-cuisines Lambda function
    Value: !GetAtt GetCuisinesFunction.Arn

  SearchRestaurantsFunctionArn:
    Description: ARN of the search-restaurants Lambda function
    Value: !GetAtt SearchRestaurantsFunction.Arn

  GetAvailabilityFunctionArn:
    Description: ARN of the get-availability Lambda function
    Value: !GetAtt GetAvailabilityFunction.Arn
