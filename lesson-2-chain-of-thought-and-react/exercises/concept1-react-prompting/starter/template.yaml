Description: Lambda functions for the restaurant recommendation agent exercise

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: restaurant-agent-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GetCuisinesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-cuisines
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json


          RESTAURANTS = [
              {"id": "r1", "name": "Trattoria Bella", "cuisine": "Italian",  "rating": 4.6},
              {"id": "r2", "name": "Osteria Romana",  "cuisine": "Italian",  "rating": 4.4},
              {"id": "r3", "name": "Sakura Garden",   "cuisine": "Japanese", "rating": 4.7},
              {"id": "r4", "name": "Ramen Yuki",      "cuisine": "Japanese", "rating": 4.9},
              {"id": "r5", "name": "El Mercado",      "cuisine": "Mexican",  "rating": 4.3},
              {"id": "r6", "name": "Spice Route",     "cuisine": "Indian",   "rating": 4.6},
              {"id": "r7", "name": "Le Bistro",       "cuisine": "French",   "rating": 4.8},
              {"id": "r8", "name": "The Grill House", "cuisine": "American", "rating": 4.2},
          ]


          def lambda_handler(event, context):
              print("EVENT:", json.dumps(event, default=str))
              cuisines = sorted(set(r["cuisine"] for r in RESTAURANTS))
              result = {"cuisines": cuisines}

              return result

  GetCuisinesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetCuisinesFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com

  SearchRestaurantsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: search-restaurants
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json


          RESTAURANTS = [
              {"id": "r1", "name": "Trattoria Bella", "cuisine": "Italian",  "rating": 4.6},
              {"id": "r2", "name": "Osteria Romana",  "cuisine": "Italian",  "rating": 4.4},
              {"id": "r3", "name": "Sakura Garden",   "cuisine": "Japanese", "rating": 4.7},
              {"id": "r4", "name": "Ramen Yuki",      "cuisine": "Japanese", "rating": 4.9},
              {"id": "r5", "name": "El Mercado",      "cuisine": "Mexican",  "rating": 4.3},
              {"id": "r6", "name": "Spice Route",     "cuisine": "Indian",   "rating": 4.6},
              {"id": "r7", "name": "Le Bistro",       "cuisine": "French",   "rating": 4.8},
              {"id": "r8", "name": "The Grill House", "cuisine": "American", "rating": 4.2},
          ]


          def lambda_handler(event, context):
              print("EVENT:", json.dumps(event, default=str))
              cuisine = (event.get("cuisine") or "").lower()

              if cuisine:
                  restaurants = [r for r in RESTAURANTS if r["cuisine"].lower() == cuisine]
                  if not restaurants:
                      result = {"error": f"No {cuisine.title()} restaurants found."}
                  else:
                      result = {"restaurants": restaurants}
              else:
                  result = {"restaurants": RESTAURANTS}

              return result

  SearchRestaurantsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SearchRestaurantsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com

  GetAvailabilityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-availability
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json


          AVAILABILITY = {
              "r1": True,
              "r2": False,
              "r3": True,
              "r4": False,
              "r5": True,
              "r6": True,
              "r7": False,
              "r8": True,
          }


          def lambda_handler(event, context):
              print("EVENT:", json.dumps(event, default=str))
              restaurant_id = event.get("restaurant_id", "")

              available = AVAILABILITY.get(restaurant_id, False)
              result = {
                  "restaurant_id": restaurant_id,
                  "available": available,
              }

              return result

  GetAvailabilityPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetAvailabilityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com

